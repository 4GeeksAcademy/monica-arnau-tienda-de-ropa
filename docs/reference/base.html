<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantilla — Maison Élise</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-stone-50 font-sans text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <nav aria-label="Navegación principal" class="mx-auto flex max-w-7xl flex-wrap items-center gap-4 px-4 py-5 sm:px-6 lg:px-8">
      <a href="../../index.html" aria-label="Maison Élise, inicio" class="font-serif text-2xl text-stone-900">Maison Élise</a>
      <a href="../../catalogo.html" class="text-sm text-stone-700 underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#713E43]">Catálogo</a>
      <a href="../../carrito.html" class="text-sm text-stone-700 underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#713E43]">Carrito</a>
      <form action="../../catalogo.html" method="get" role="search" class="flex min-w-0 flex-1 flex-wrap items-center gap-2 sm:ml-auto sm:flex-nowrap">
        <label for="busqueda" class="sr-only">Buscar prendas</label>
        <input id="busqueda" name="q" type="search" placeholder="Buscar prendas" autocomplete="off" class="min-w-0 flex-1 rounded border border-stone-300 bg-white px-3 py-2 text-stone-900 placeholder:text-stone-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#713E43]">
        <button type="submit" class="rounded bg-[#713E43] px-4 py-2 text-sm font-medium text-white hover:bg-[#5f3338] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-900">Buscar</button>
      </form>
      <span aria-label="Acceso a cuenta no disponible en esta demostración" class="text-sm text-stone-700">Mi cuenta</span>
    </nav>
  </header>
  <main id="contenido-principal" class="mx-auto min-h-48 w-full max-w-7xl px-4 sm:px-6 lg:px-8"></main>
  <footer class="border-t border-stone-200 bg-white">
    <div class="mx-auto grid max-w-7xl grid-cols-1 gap-8 px-4 py-10 sm:grid-cols-2 sm:px-6 lg:grid-cols-3 lg:px-8">
      <section aria-labelledby="footer-categorias">
        <h2 id="footer-categorias" class="font-serif text-lg text-stone-900">Categorías</h2>
        <ul class="mt-3 space-y-2 text-sm text-stone-700">
          <li><a class="underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-[#713E43]" href="../../catalogo.html">Calzado</a></li>
          <li><a class="underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-[#713E43]" href="../../catalogo.html">Camisas</a></li>
          <li><a class="underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-[#713E43]" href="../../catalogo.html">Pantalones</a></li>
          <li><a class="underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-[#713E43]" href="../../catalogo.html">Accesorios</a></li>
        </ul>
      </section>
      <section aria-labelledby="footer-informacion">
        <h2 id="footer-informacion" class="font-serif text-lg text-stone-900">Información</h2>
        <ul class="mt-3 space-y-2 text-sm text-stone-700">
          <li>Términos y condiciones</li>
          <li>Política de privacidad</li>
          <li>Sobre la marca</li>
        </ul>
      </section>
      <section aria-labelledby="footer-contacto">
        <h2 id="footer-contacto" class="font-serif text-lg text-stone-900">Contacto</h2>
        <p class="mt-3 text-sm text-stone-700">Información de contacto de demostración.</p>
      </section>
    </div>
  </footer>
</body>
</html>
